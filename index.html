<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#061018" />
  <title>The Blackwake — Pirate Ship Viewer</title>
  <style>
    :root { --ink:#1a120b; --parchment:#f4e6c8; --gold:#e2b657; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; overflow:hidden; background:#061018; touch-action:none; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    #hud { position:fixed; inset:0; pointer-events:none; font-family:"Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; color:var(--parchment); }
    header { position:absolute; top:24px; left:28px; text-shadow:0 2px 16px rgba(0,0,0,.55); }
    @media (max-width:640px) {
      header { top:14px; left:16px; right:16px; }
      header .sub { display:none; }
      #credits { left:16px; bottom:14px; font-size:11px; max-width:55vw; }
      #hint { right:16px; bottom:56px; font-size:11px; }
      #reset { left:auto; right:16px; bottom:14px; }
    }
    header p.kicker { letter-spacing:.28em; text-transform:uppercase; font-size:11px; opacity:.75; margin-bottom:6px; }
    header h1 { font-size:clamp(28px,4vw,42px); font-weight:600; line-height:1; color:#fff6df; }
    header .sub { margin-top:8px; font-size:14px; opacity:.8; max-width:36ch; }
    #credits { position:absolute; bottom:22px; left:28px; font-size:12px; opacity:.72; line-height:1.55; }
    #credits a { color:var(--gold); text-decoration:none; pointer-events:auto; }
    #hint { position:absolute; bottom:22px; right:28px; font-size:12px; opacity:.7; text-align:right; }
    #reset {
      pointer-events:auto; position:absolute; bottom:22px; right:28px; display:none;
      border:1px solid rgba(226,182,87,.45); background:rgba(6,16,24,.55); color:var(--parchment);
      font:inherit; font-size:12px; letter-spacing:.08em; padding:8px 12px; border-radius:999px; backdrop-filter:blur(8px);
    }
    @media (max-width:640px) { #reset { display:block; } #hint { right:16px; } }
    #loader { position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(ellipse at center,#123047 0%,#061018 70%); transition:opacity .6s ease; }
    #loader.hidden { opacity:0; pointer-events:none; }
    #loader .mark { text-align:center; }
    #loader h2 { font-size:22px; letter-spacing:.12em; }
    #bar { width:180px; height:3px; margin:16px auto 0; background:rgba(255,255,255,.15); border-radius:99px; overflow:hidden; }
    #bar > span { display:block; height:100%; width:0%; background:var(--gold); transition:width .2s ease; }
  </style>
</head>
<body>
  <div id="hud">
    <header>
      <p class="kicker">Three.js scene</p>
      <h1>The Blackwake</h1>
      <p class="sub">Orbit the galleon. Drag to look around, scroll to close in on the deck and sails.</p>
    </header>
    <div id="credits">
      Ship model: <a href="https://kenney.nl/assets/pirate-kit" target="_blank" rel="noopener">Kenney Pirate Kit</a> (CC0)<br />
      Scene assembled for sharing on the web.
    </div>
    <div id="hint">Drag to orbit · Pinch to zoom<br />Two-finger drag to pan</div>
    <button id="reset" type="button">Reset view</button>
    <div id="loader">
      <div class="mark">
        <h2>SETTING SAIL</h2>
        <div id="bar"><span></span></div>
      </div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    const bar = document.querySelector('#bar > span');
    const loaderEl = document.getElementById('loader');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7eb6d9);
    scene.fog = new THREE.FogExp2(0x9ec9dc, 0.018);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
    camera.position.set(8.5, 4.2, 11);
    const isMobile = matchMedia('(max-width: 640px), (pointer: coarse)').matches;
    const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 2.2;
    controls.maxDistance = 28;
    controls.target.set(0, 1.4, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3d5a3a, 0.85));
    const sun = new THREE.DirectionalLight(0xffe0b0, 2.4);
    sun.position.set(-18, 16, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
    sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
    sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
    sun.shadow.bias = -0.0004;
    scene.add(sun); scene.add(sun.target);
    scene.add(new THREE.DirectionalLight(0x88b8e8, 0.55)).position.set(12, 6, -10);
    const fill = new THREE.DirectionalLight(0x88b8e8, 0.55); fill.position.set(12,6,-10); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffc978, 0.7); rim.position.set(4,3,14); scene.add(rim);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { top:{value:new THREE.Color(0x4ea4d6)}, mid:{value:new THREE.Color(0xc8e4f2)}, horizon:{value:new THREE.Color(0xf3c98a)} },
      vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `varying vec3 vPos; uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; void main(){ float h=normalize(vPos).y; vec3 col=mix(horizon,mid,smoothstep(-0.05,0.18,h)); col=mix(col,top,smoothstep(0.18,0.85,h)); gl_FragColor=vec4(col,1.0); }`
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(180,32,16), skyMat));
    const waterUniforms = { uTime:{value:0}, uColorDeep:{value:new THREE.Color(0x1a6a7a)}, uColorShallow:{value:new THREE.Color(0x3fa8b5)} };
    const waterMat = new THREE.ShaderMaterial({
      uniforms: waterUniforms, transparent: true,
      vertexShader: `uniform float uTime; varying vec3 vWorld; varying float vWave; void main(){ vec3 p=position; float w1=sin(p.x*0.35+uTime*1.1)*0.08; float w2=sin(p.y*0.28+uTime*0.8)*0.06; p.z+=w1+w2; vWave=w1+w2; vec4 world=modelMatrix*vec4(p,1.0); vWorld=world.xyz; gl_Position=projectionMatrix*viewMatrix*world; }`,
      fragmentShader: `uniform vec3 uColorDeep; uniform vec3 uColorShallow; varying vec3 vWorld; varying float vWave; void main(){ float fres=pow(1.0-abs(normalize(cameraPosition-vWorld).y),2.2); vec3 col=mix(uColorDeep,uColorShallow,0.45+vWave*2.0); col=mix(col,vec3(0.78,0.90,0.95),fres*0.55); gl_FragColor=vec4(col,0.92); }`
    });
    const water = new THREE.Mesh(new THREE.PlaneGeometry(160,160,96,96), waterMat);
    water.rotation.x = -Math.PI/2; water.receiveShadow = true; scene.add(water);
    function island(x,z,r,h){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7), new THREE.MeshStandardMaterial({color:0x2f6b46,roughness:0.9,flatShading:true})); m.position.set(x,h*0.15,z); scene.add(m); }
    island(-38,-22,7,5); island(42,-28,9,6.5); island(-26,34,5.5,4);
    const clock = new THREE.Clock(); let ship=null; let shipBaseY=0;
    const gltfLoader = new GLTFLoader();
    function b64ToArrayBuffer(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }
    function hideLoader(){ bar.style.width='100%'; setTimeout(()=>loaderEl.classList.add('hidden'),250); }
    function onShipLoaded(gltf){
      ship = gltf.scene;
      ship.traverse((obj)=>{ if(obj.isMesh){ obj.castShadow=true; obj.receiveShadow=true; if(obj.material){ obj.material.metalness=Math.min(obj.material.metalness??0,0.15); obj.material.roughness=Math.max(obj.material.roughness??0.7,0.45);} } });
      const box=new THREE.Box3().setFromObject(ship); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3());
      const scale=7.5/Math.max(size.x,size.y,size.z); ship.scale.setScalar(scale); ship.position.sub(center.multiplyScalar(scale)); ship.position.y-=box.min.y*scale-0.12; shipBaseY=ship.position.y; scene.add(ship);
      controls.target.set(0,size.y*scale*0.35,0); camera.position.set(8.2,3.8,10.5); controls.update(); hideLoader();
    }
    function addStandInShip(){
      const g=new THREE.Group();
      const wood=new THREE.MeshStandardMaterial({color:0x6b3a1f,roughness:0.8});
      const dark=new THREE.MeshStandardMaterial({color:0x3a2416,roughness:0.85});
      const sail=new THREE.MeshStandardMaterial({color:0xf3efe2,roughness:0.7,side:THREE.DoubleSide});
      const hull=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.7,5.4),wood); hull.position.y=0.45;
      const bow=new THREE.Mesh(new THREE.ConeGeometry(1.1,1.6,4),wood); bow.rotation.x=Math.PI/2; bow.position.set(0,0.45,-3.2);
      const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,4.2,8),dark); mast.position.y=2.5;
      const sailM=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.4),sail); sailM.position.set(0.15,2.4,0);
      g.add(hull,bow,mast,sailM); g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
      ship=g; shipBaseY=0.12; g.position.y=shipBaseY; scene.add(g);
      controls.target.set(0,1.6,0); camera.position.set(8.2,3.8,10.5); controls.update(); hideLoader();
    }
    const GLB_SOURCES=['./ship-pirate-large.glb','https://cdn.jsdelivr.net/gh/lukebrady/blackwake-pirate-ship-viewer@main/ship-pirate-large.glb'];
    const MODULE_SOURCES=['./ship-data.js','./parts/ship-data.js','https://cdn.jsdelivr.net/gh/lukebrady/blackwake-pirate-ship-viewer@main/ship-data.js','https://cdn.jsdelivr.net/gh/lukebrady/blackwake-pirate-ship-viewer@main/parts/ship-data.js'];
    function loadGlb(url){ return new Promise((resolve,reject)=>{ gltfLoader.load(url,resolve,e=>{ if(e.total) bar.style.width=Math.min(85,20+60*e.loaded/e.total)+'%'; },reject); }); }
    async function loadShip(){
      for (const url of GLB_SOURCES){ try { onShipLoaded(await loadGlb(url)); return; } catch(err){ console.warn('GLB failed', url, err); } }
      for (const url of MODULE_SOURCES){ try { const mod=await import(url); if(!mod.SHIP_GLB_B64) throw new Error('empty'); await new Promise((resolve,reject)=>{ try { gltfLoader.parse(b64ToArrayBuffer(mod.SHIP_GLB_B64),'',(g)=>{ onShipLoaded(g); resolve(); },reject); } catch(e){ reject(e); } }); return; } catch(err){ console.warn('module failed', url, err); } }
      addStandInShip();
    }
    loadShip();
    addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
    function resetView(){ camera.position.set(8.2,3.8,10.5); controls.target.set(0,1.6,0); controls.autoRotate=true; controls.update(); }
    addEventListener('pointerdown', e=>{ if(e.target && e.target.id==='reset') return; controls.autoRotate=false; });
    document.getElementById('reset').addEventListener('click', resetView);
    renderer.setAnimationLoop(()=>{ const t=clock.getElapsedTime(); waterUniforms.uTime.value=t; if(ship){ ship.position.y=shipBaseY+Math.sin(t*0.9)*0.06; ship.rotation.z=Math.sin(t*0.7)*0.015; } controls.update(); renderer.render(scene,camera); });
  </script>
</body>
</html>
